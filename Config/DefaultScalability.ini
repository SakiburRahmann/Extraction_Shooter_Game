[ScalabilitySettings]
; Change engine defaults so a high end 2018 GPU will end up at a mix of Epic and High settings
; The resolution quality will need to be modified by users with 4k displays with the current autodetection system
PerfIndexThresholds_ResolutionQuality="GPU 18 115 350"
PerfIndexThresholds_ViewDistanceQuality="GPU 18 115 250"
PerfIndexThresholds_AntiAliasingQuality="GPU 18 115 500"
PerfIndexThresholds_ShadowQuality="GPU 18 115 500"
PerfIndexThresholds_GlobalIlluminationQuality="GPU 18 115 500"
PerfIndexThresholds_ReflectionQuality="GPU 18 115 350"
PerfIndexThresholds_PostProcessQuality="GPU 18 115 350"
PerfIndexThresholds_TextureQuality="GPU 18 115 250"
PerfIndexThresholds_EffectsQuality="GPU 18 115 350"
PerfIndexThresholds_FoliageQuality="GPU 18 115 250"
PerfIndexThresholds_ShadingQuality="GPU 18 115 250"


; Change some shadow settings to match the map content
[ShadowQuality@0]
r.Shadow.Virtual.ResolutionLodBiasDirectional=0

[ShadowQuality@1]
r.Shadow.Virtual.ResolutionLodBiasDirectional=0

[ShadowQuality@2]
r.Shadow.Virtual.ResolutionLodBiasDirectional=0

[ShadowQuality@3]
r.Shadow.Virtual.ResolutionLodBiasDirectional=-1.5

; Engine scalability groups can be reorganized by using game-specific ini override syntax
; These changes disable the FoliageQuality group entirely and moves those settings over to ViewDistanceQuality
[FoliageQuality@0]
-foliage.DensityScale=0
-grass.DensityScale=0

[FoliageQuality@1]
-foliage.DensityScale=0.4
-grass.DensityScale=0.4

[FoliageQuality@2]
-foliage.DensityScale=0.8
-grass.DensityScale=0.8

[FoliageQuality@3]
-foliage.DensityScale=1.0
-grass.DensityScale=1.0

[FoliageQuality@Cine]
-foliage.DensityScale=1.0
-grass.DensityScale=1.0


[ViewDistanceQuality@0]
foliage.DensityScale=0
grass.DensityScale=0

[ViewDistanceQuality@1]
foliage.DensityScale=0.4
grass.DensityScale=0.4

[ViewDistanceQuality@2]
foliage.DensityScale=1.0
grass.DensityScale=1.0

[ViewDistanceQuality@3]
foliage.DensityScale=1.0
grass.DensityScale=1.0

[ViewDistanceQuality@Cine]
foliage.DensityScale=1.0
grass.DensityScale=1.0

; LowSpec tuning for iGPU laptops - last value wins
[ScalabilitySettings]
PerfIndexValues_ResolutionQuality="50 50 50 50"
[ShadowQuality@0]
r.Shadow.MaxResolution=512
r.Shadow.Virtual.Enable=0
[PostProcessQuality@0]
r.MotionBlurQuality=0
r.AmbientOcclusionLevels=0
r.BloomQuality=0
r.LensFlareQuality=0
[TextureQuality@0]
; 600MB pool for shared-memory iGPU (was 2048 — too big, contributed to freeze)
r.Streaming.PoolSize=600
[EffectsQuality@0]
r.SSS.Scale=0


; Budget-bump tuning (one notch up, still iGPU-friendly)
; Shadows @1: allow dynamic shadows but cap every dimension
[ShadowQuality@1]
r.Shadow.MaxResolution=1024
r.Shadow.MaxCSMResolution=1024
r.Shadow.CSM.MaxCascades=2
r.Shadow.DistanceScale=0.7
r.DistanceFieldShadowing=0
r.VolumetricFog=0
r.LightMaxDrawDistanceScale=0.6

; PostProcess @1: keep the cheap film-grain-free basics, kill the two blur costs
[PostProcessQuality@1]
r.MotionBlurQuality=0
r.DepthOfFieldQuality=0
r.BloomQuality=3
r.EyeAdaptationQuality=1
r.LensFlareQuality=0
r.SceneColorFringeQuality=0
r.RenderTargetPoolMin=300

; Textures @2: engine default wants a 600MB pool; keep the roomy 2048MB
[TextureQuality@2]
r.Streaming.PoolSize=2048
r.MaxAnisotropy=4
r.VT.MaxAnisotropy=4

; Effects @1: no subsurface scattering cost
[EffectsQuality@1]
r.SSS.Scale=0

; Shading @1: nothing to override — the engine's level-1 defaults are fine (forward-shading cvar no longer exists in 5.8)


; Second notch (still no heavy features)
; Shadows @2: engine wants 4 cascades / volumetric fog / DF shadows — we take crisper 2048px maps at 2 cascades instead
[ShadowQuality@2]
r.Shadow.MaxResolution=2048
r.Shadow.MaxCSMResolution=2048
r.Shadow.CSM.MaxCascades=2
r.Shadow.DistanceScale=0.75
r.DistanceFieldShadowing=0
r.VolumetricFog=0
r.LightMaxDrawDistanceScale=0.75

; PostProcess @2: keep SSAO grounding (the win), kill blur costs and pricey lens effects
[PostProcessQuality@2]
r.MotionBlurQuality=0
r.DepthOfFieldQuality=0
r.LensFlareQuality=0
r.SceneColorFringeQuality=0
r.AmbientOcclusionLevels=2
r.AmbientOcclusionMaxQuality=80
r.BloomQuality=4
r.RenderTargetPoolMin=400

; Textures @3 (engine Epic): mip bias 0 is the win; aniso 8 sharpens grazing angles, pool stays roomy
[TextureQuality@3]
r.MaxAnisotropy=8
r.VT.MaxAnisotropy=8
r.Streaming.PoolSize=2048
r.Streaming.LimitPoolSizeToVRAM=1

; Effects @2 (engine High): high materials OK; SSS and SSGI stay off
[EffectsQuality@2]
r.SSS.Scale=0
r.SSGI.Quality=0