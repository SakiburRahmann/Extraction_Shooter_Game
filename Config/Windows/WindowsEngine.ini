[ConsoleVariables]
dp.AllowScalabilityGroupsToChangeAtRuntime=1
r.DynamicRes.OperationMode=0
r.PSOPrecaching=0
r.Lumen=0
r.Nanite=0
r.Shadow.Virtual.Enable=0
